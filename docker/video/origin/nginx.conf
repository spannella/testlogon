worker_processes 1;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;

  server {
    listen 8080;
    server_name _;

    location = /healthz {
      default_type text/plain;
      return 200 'ok';
    }

    location / {
      root /var/www/media;
      autoindex on;
      add_header Access-Control-Allow-Origin "*";
      add_header Cache-Control "no-store";
    }
  }
}
