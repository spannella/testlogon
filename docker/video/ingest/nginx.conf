worker_processes  1;

events {
    worker_connections  1024;
}

rtmp {
    server {
        listen 1935;
        chunk_size 4096;

        application live {
            live on;
            record off;
            wait_key on;
            # Accept stream keys under /live/<stream_key>.
            # Transcoder pulls from: rtmp://ingest/live/<stream_key>
        }
    }
}

http {
    server {
        listen 80;

        location /healthz {
            default_type text/plain;
            return 200 "ok";
        }
    }
}
