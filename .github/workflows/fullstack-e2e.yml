name: Full-Stack E2E

# Stands up the entire local dev stack (DynamoDB Local + moto + backend + Vite
# frontend + seeded sessions) and runs the Playwright specs that need it — the
# specs the old serverless browser-ssh / google-calendar jobs could never run.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "frontend/e2e/browser-ssh.spec.ts"
      - "frontend/e2e/calendar-messaging.spec.ts"
      - "frontend/e2e/signing.spec.ts"
      - "frontend/e2e/signing-inbox.spec.ts"
      - "frontend/e2e/webrtc-calls.spec.ts"
      - "frontend/e2e/google-calendar-mock.spec.ts"
      - "frontend/e2e/google-drive-mock.spec.ts"
      - "frontend/e2e/apple-caldav-mock.spec.ts"
      - "frontend/e2e/jira-mock.spec.ts"
      - "frontend/src/pages/remote/**"
      - "frontend/src/pages/calendar/**"
      - "frontend/src/pages/signing/**"
      - "frontend/src/pages/files/SignaturePacketComposer.tsx"
      - "app/routers/browser_ssh_terminal.py"
      - "app/routers/calendar.py"
      - "app/routers/signature_packets.py"
      - "app/routers/messaging.py"
      - "app/routers/google_calendar_mock.py"
      - "app/routers/google_drive_mock.py"
      - "app/routers/apple_caldav_mock.py"
      - "app/routers/jira_mock.py"
      - "app/services/host_inventory.py"
      - "app/services/signature_packet_store.py"
      - "app/services/messaging_call_lifecycle.py"
      - ".github/workflows/fullstack-e2e.yml"
  push:
    branches: [ main, master ]
    paths:
      - "frontend/e2e/browser-ssh.spec.ts"
      - "frontend/e2e/calendar-messaging.spec.ts"
      - "frontend/e2e/signing.spec.ts"
      - "frontend/e2e/signing-inbox.spec.ts"
      - "frontend/e2e/webrtc-calls.spec.ts"
      - "frontend/e2e/google-calendar-mock.spec.ts"
      - "frontend/e2e/google-drive-mock.spec.ts"
      - "frontend/e2e/apple-caldav-mock.spec.ts"
      - "frontend/e2e/jira-mock.spec.ts"
      - ".github/workflows/fullstack-e2e.yml"

jobs:
  fullstack-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Serve the dev SPA at "/" (not the vite base "/static/") so the Playwright
    # specs' bare app-route navigations (http://localhost:3000/shop, /login, ...)
    # resolve and the client router (basename=BASE_URL) matches them — mirrors
    # how prod serves index.html at "/". Read by frontend/vite.config.ts at boot.
    env:
      E2E_BASE_ROOT: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20 (repo targets 20; runner default 22 breaks native deps)
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps (deterministic + visible errors; setup_ubuntu's
              `npm install --silent` otherwise hides failures)
        working-directory: frontend
        run: npm ci

      - name: Install just (avoids setup_ubuntu's just.systems curl, which 403s in CI)
        uses: extractions/setup-just@v2

      - name: Bootstrap dev host (Java, venv+deps, moto, Playwright, .env.local)
        run: bash scripts/setup_ubuntu.sh

      - name: Put project venv on PATH
        # dev.sh / local-stack-up.sh / the session seeders invoke bare `python3`;
        # a fresh runner's system python lacks the deps, so resolve python3 to the venv.
        run: echo "${GITHUB_WORKSPACE}/.venv/bin" >> "$GITHUB_PATH"

      - name: Enable E2E feature flags (before stack start — backend + Vite read env at boot)
        run: |
          cat scripts/ci-e2e-feature-flags.env >> .env.local
          {
            echo "VITE_CALL_RECORDING_ENABLED=true"
            echo "VITE_CANONICAL_PROFILE_NAVIGATION_ENABLED=true"
            echo "VITE_MESSAGING_WEBRTC_DIRECT_CALL_ENABLED=true"
          } >> frontend/.env.local

      - name: Start dev stack + seed E2E sessions
        run: just up

      - name: Wait for backend + frontend to be ready
        run: |
          ok=0
          for i in $(seq 1 90); do
            if curl -sf http://localhost:8000/health >/dev/null \
               && curl -sf http://localhost:3000/ >/dev/null; then ok=1; break; fi
            sleep 2
          done
          if [ "$ok" -ne 1 ]; then
            echo "::error::stack did not come up"; scripts/dev.sh status || true
            echo "----- backend.log -----"; tail -n 150 .logs/dev/backend.log 2>/dev/null || true
            echo "----- infra logs -----"; tail -n 40 .logs/*.log 2>/dev/null || true
            exit 1
          fi
          echo "stack is up"

      - name: Run full-stack Playwright specs
        working-directory: frontend
        run: >
          npx playwright test
          e2e/browser-ssh.spec.ts
          e2e/calendar-messaging.spec.ts
          e2e/signing.spec.ts
          e2e/signing-inbox.spec.ts
          e2e/webrtc-calls.spec.ts
          e2e/google-calendar-mock.spec.ts
          e2e/apple-caldav-mock.spec.ts
          e2e/jira-mock.spec.ts

      # QUARANTINE (non-blocking): google-drive-mock.spec.ts sections 73/74 are
      # flaky ONLY inside this 9-spec shared-process run (a different subset of the
      # seeded-file read tests fails each run: DDB-seeded fs_mount + in-memory Google
      # Drive mock race under full-suite load). They pass deterministically in
      # isolation (10/10) and paired with google-calendar-mock (23/23). Run them
      # here informationally so regressions are still visible, but continue-on-error
      # so this known full-suite flake cannot red the aggregate gate. See
      # frontend/e2e/google-drive-mock.spec.ts header + fullstack-e2e quarantine note.
      - name: (quarantined, non-blocking) Google Drive mount specs
        working-directory: frontend
        continue-on-error: true
        run: npx playwright test e2e/google-drive-mock.spec.ts

      - name: Upload logs + traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fullstack-e2e-debug
          path: |
            .logs/
            .logs/dev/
            frontend/test-results/
            frontend/playwright-report/
          if-no-files-found: ignore
