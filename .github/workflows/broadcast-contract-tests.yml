name: Broadcast Contract Tests

on:
  pull_request:
    paths:
      - "app/routers/broadcast.py"
      - "app/services/broadcast_*.py"
      - "app/models_broadcast.py"
      - "tests/contract/**"
      - "tests/fixtures/broadcast_api_contract_snapshot.json"
      - ".github/workflows/broadcast-contract-tests.yml"
  push:
    branches: [ main ]
    paths:
      - "app/routers/broadcast.py"
      - "app/services/broadcast_*.py"
      - "app/models_broadcast.py"
      - "tests/contract/**"
      - "tests/fixtures/broadcast_api_contract_snapshot.json"

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run broadcast contract suite
        run: |
          pytest -q tests/contract
