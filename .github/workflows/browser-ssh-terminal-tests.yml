name: Browser SSH Terminal Test Suite

on:
  pull_request:
  push:
    branches: [ main, master ]

# NOTE: the Playwright UI flow for the browser SSH terminal moved to the
# full-stack harness in .github/workflows/fullstack-e2e.yml (it needs the whole
# dev stack — Vite + backend + DDB + seeded sessions). The old serverless
# browser-ssh-playwright-e2e job here ran a nonexistent spec against no frontend
# and was removed.
jobs:
  browser-ssh-backend-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run browser SSH backend unit/integration/e2e tests
        run: |
          pytest -q tests/test_browser_ssh_terminal_protocol_unit.py tests/test_browser_ssh_terminal_e2e_flow.py tests/test_browser_ssh_terminal_scaffold.py tests/test_browser_ssh_terminal_form_ui.py tests/test_browser_ssh_terminal_security.py
