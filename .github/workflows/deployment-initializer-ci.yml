name: deployment-initializer-ci

on:
  push:
    paths:
      - 'deployment_initializer/**'
      - '.github/workflows/deployment-initializer-ci.yml'
  pull_request:
    paths:
      - 'deployment_initializer/**'
      - '.github/workflows/deployment-initializer-ci.yml'

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deployment_initializer/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: deployment_initializer/frontend/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deployment_initializer/backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

  backend-e2e:
    runs-on: ubuntu-latest
    needs: backend
    defaults:
      run:
        working-directory: deployment_initializer/backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run live-safe + mock e2e suite
        run: pytest -q tests/test_e2e_flow.py
