name: Broadcast Local E2E (Nightly/Manual)

on:
  schedule:
    - cron: "30 5 * * *"
  workflow_dispatch:

jobs:
  local-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run local broadcast E2E harness
        run: |
          python scripts/e2e/broadcast_local_e2e.py
      - name: Upload E2E artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: broadcast-local-e2e-artifacts
          path: tmp/broadcast-e2e-artifacts
