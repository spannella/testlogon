# TestLogon 1:1 WebRTC TURN (FIX B / #97). Auth via TURN REST (use-auth-secret) -> NOT an open relay.
# Deployed to /etc/turnserver.conf on the prod EC2 (i-08f937fc705ebea75, 18.222.237.167).
# coturn 4.6.1, systemd unit `coturn` (enabled, survives reboot).
use-auth-secret
static-auth-secret=<REDACTED_64_HEX_SECRET>
realm=tl-api.bitbazaar.cc
listening-port=3478
min-port=49160
max-port=49200
external-ip=18.222.237.167/172.31.25.6
fingerprint
no-cli
no-tlsv1
no-tlsv1_1
no-multicast-peers
# deny relaying to internal/link-local ranges (hardening)
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
allowed-peer-ip=172.31.25.6
