<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Broadcast Devtools</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 18px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .card { border: 1px solid #ddd; border-radius: 8px; padding: 12px; }
    pre { background: #111; color: #eee; padding: 10px; border-radius: 6px; max-height: 280px; overflow: auto; }
    ul { max-height: 260px; overflow: auto; }
  </style>
</head>
<body>
  <h2>Broadcast Local Debug/Ops</h2>
  <p id="stamp">Polling…</p>
  <div class="grid">
    <div class="card">
      <h3>Ingest</h3>
      <div id="ingest"></div>
      <h4>Manifest URL</h4>
      <a id="manifest" href="#" target="_blank" rel="noopener noreferrer">N/A</a>
      <h4>Stream Keys</h4>
      <ul id="streamKeys"></ul>
    </div>
    <div class="card">
      <h3>Archive Objects</h3>
      <ul id="archiveObjects"></ul>
    </div>
  </div>
  <div class="card" style="margin-top:16px;">
    <h3>Transcoder Log Tail</h3>
    <pre id="ffmpegLog"></pre>
  </div>

  <script>
    async function refresh() {
      const res = await fetch('/internal/broadcast-dev/status', { credentials: 'include' });
      if (!res.ok) throw new Error('Failed status: ' + res.status);
      const data = await res.json();

      document.getElementById('stamp').textContent = 'Last updated: ' + new Date().toLocaleTimeString();
      document.getElementById('ingest').textContent = `healthy=${data.ingest.healthy} endpoint=${data.ingest.endpoint}`;

      const manifest = document.getElementById('manifest');
      manifest.href = data.manifest_url || '#';
      manifest.textContent = data.manifest_url || 'N/A';

      const sk = document.getElementById('streamKeys');
      sk.innerHTML = '';
      (data.stream_keys || []).forEach((k) => {
        const li = document.createElement('li');
        li.textContent = k;
        sk.appendChild(li);
      });

      const ao = document.getElementById('archiveObjects');
      ao.innerHTML = '';
      (data.archive_objects || []).forEach((k) => {
        const li = document.createElement('li');
        li.textContent = k;
        ao.appendChild(li);
      });

      document.getElementById('ffmpegLog').textContent = (data.transcoder_log_tail || []).join('\n');
    }

    async function loop() {
      try { await refresh(); } catch (err) {
        document.getElementById('stamp').textContent = String(err);
      }
      setTimeout(loop, 5000);
    }
    loop();
  </script>
</body>
</html>
