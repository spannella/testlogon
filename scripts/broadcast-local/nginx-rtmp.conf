worker_processes auto;

events {
  worker_connections 1024;
}

rtmp {
  server {
    listen 1935;
    chunk_size 4096;

    application live {
      live on;
      record off;

      # Stream key mapping: OBS publishes to rtmp://localhost:1935/live/<stream_key>
      # The stream_key is available as $name and consumed by ffmpeg-worker.
      allow publish all;
      allow play all;
    }
  }
}

http {
  server {
    listen 8080;

    location /stat {
      rtmp_stat all;
      rtmp_stat_stylesheet stat.xsl;
    }

    location /stat.xsl {
      root /usr/local/nginx/html;
    }

    location /healthz {
      add_header Content-Type text/plain;
      return 200 'ok';
    }
  }
}
