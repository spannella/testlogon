appId: com.testlogon.android
---
- stopApp
- launchApp:
    clearState: true
- assertVisible:
    id: "login_screen"
- tapOn:
    id: "login_email"
- inputText: "c_par35_1785838888@example.com"
- tapOn:
    id: "login_password"
- inputText: "Passw0rd!123"
- hideKeyboard
- tapOn:
    id: "login_submit"
- extendedWaitUntil:
    visible:
      id: "tab_more"
    timeout: 30000
- tapOn:
    id: "tab_more"
- assertVisible:
    id: "more_screen"
- tapOn:
    id: "more_hub_community"
- assertVisible:
    id: "more_hub_screen"
- scrollUntilVisible:
    element:
      id: "more_entry_organizations"
    direction: DOWN
    timeout: 15000
- tapOn:
    id: "more_entry_organizations"
- assertVisible:
    id: "org_overview_screen"
- extendedWaitUntil:
    visible:
      id: "org_overview_leave"
    timeout: 15000
- tapOn:
    id: "org_overview_leave"
- assertVisible:
    text: "Leave organization?"
- assertVisible:
    text: "Leave"
- tapOn:
    text: "Leave"
