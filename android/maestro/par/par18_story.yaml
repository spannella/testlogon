appId: com.testlogon.android
---
- launchApp
- extendedWaitUntil:
    visible:
      id: "tab_feed"
    timeout: 20000
- tapOn:
    id: "tab_feed"
- assertVisible:
    id: "feed_screen"
- extendedWaitUntil:
    visible:
      id: "story_ring"
    timeout: 15000
# open B's story (only followed author with a story)
- tapOn:
    id: "story_ring"
- assertVisible:
    id: "story_viewer"
# overflow must be present on a NON-own story
- assertVisible:
    id: "story_viewer_overflow"
- tapOn:
    id: "story_viewer_overflow"
- assertVisible:
    id: "story_viewer_menu_report"
- assertVisible:
    id: "story_viewer_menu_block"
# Report story
- tapOn:
    id: "story_viewer_menu_report"
- assertVisible:
    id: "report_sheet"
- tapOn:
    id: "report_topic_spam"
- tapOn:
    id: "report_statement_field"
- inputText: "PAR-18 automated report of this story for verification purposes."
- hideKeyboard
- tapOn:
    id: "report_submit"
- extendedWaitUntil:
    visible:
      id: "report_success"
    timeout: 15000
