appId: com.testlogon.android
---
- tapOn:
    id: "tab_more"
- assertVisible:
    id: "more_screen"
# open ACCOUNT hub then Safety Center entry
- tapOn:
    id: "more_hub_account"
- assertVisible:
    id: "more_entry_safety_center"
- tapOn:
    id: "more_entry_safety_center"
- assertVisible:
    id: "safety_center_screen"
- assertVisible:
    id: "safety_center_list"
# Row 1: Blocked accounts
- tapOn:
    id: "safety_center_row_blocked_users"
- assertVisible:
    id: "blocked_users_screen"
- back
- assertVisible:
    id: "safety_center_screen"
# Row 2: DMCA
- tapOn:
    id: "safety_center_row_dmca"
- assertVisible:
    id: "dmca_screen"
- back
- assertVisible:
    id: "safety_center_screen"
# Row 3: Privacy / data export
- tapOn:
    id: "safety_center_row_privacy_export"
- assertVisible:
    id: "privacy_export_screen"
- back
- assertVisible:
    id: "safety_center_screen"
# Row 4: Account deletion
- tapOn:
    id: "safety_center_row_account_deletion"
- assertVisible:
    id: "account_deletion_screen"
- back
- assertVisible:
    id: "safety_center_screen"
