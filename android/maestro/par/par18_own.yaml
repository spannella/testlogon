appId: com.testlogon.android
---
- launchApp
- extendedWaitUntil:
    visible:
      id: "tab_feed"
    timeout: 20000
- tapOn:
    id: "tab_feed"
- extendedWaitUntil:
    visible:
      id: "story_ring"
    timeout: 15000
# tap the FIRST story_ring (A's own story, bar returns own first)
- tapOn:
    id: "story_ring"
    index: 0
- assertVisible:
    id: "story_viewer"
# overflow MUST be absent on own story
- assertNotVisible:
    id: "story_viewer_overflow"
