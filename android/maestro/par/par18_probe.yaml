appId: com.testlogon.android
---
- launchApp
- extendedWaitUntil:
    visible:
      id: "tab_feed"
    timeout: 20000
- tapOn:
    id: "tab_feed"
- extendedWaitUntil:
    visible:
      id: "story_ring"
    timeout: 15000
- tapOn:
    id: "story_ring"
- assertVisible:
    id: "story_viewer"
- tapOn:
    id: "story_viewer_overflow"
