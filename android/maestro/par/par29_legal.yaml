appId: com.testlogon.android
---
- launchApp
- extendedWaitUntil:
    visible:
      id: "tab_more"
    timeout: 20000
- tapOn:
    id: "tab_more"
- assertVisible:
    id: "more_screen"
- tapOn:
    id: "more_hub_support"
- assertVisible:
    id: "more_hub_screen"
# About (scroll to it inside the hub grid)
- scrollUntilVisible:
    element:
      id: "more_entry_about"
    direction: DOWN
    timeout: 15000
- tapOn:
    id: "more_entry_about"
- assertVisible:
    id: "about_screen"
- assertVisible:
    id: "about_version"
- back
- assertVisible:
    id: "more_hub_screen"
# Terms
- scrollUntilVisible:
    element:
      id: "more_entry_terms"
    direction: DOWN
    timeout: 15000
- tapOn:
    id: "more_entry_terms"
- assertVisible:
    id: "terms_screen"
- back
- assertVisible:
    id: "more_hub_screen"
# Community Guidelines
- scrollUntilVisible:
    element:
      id: "more_entry_community_guidelines"
    direction: DOWN
    timeout: 15000
- tapOn:
    id: "more_entry_community_guidelines"
- assertVisible:
    id: "guidelines_screen"
- back
- assertVisible:
    id: "more_hub_screen"
# Contact
- scrollUntilVisible:
    element:
      id: "more_entry_contact"
    direction: DOWN
    timeout: 15000
- tapOn:
    id: "more_entry_contact"
- assertVisible:
    id: "contact_screen"
- assertVisible:
    id: "contact_email_button"
- tapOn:
    id: "contact_email_button"
