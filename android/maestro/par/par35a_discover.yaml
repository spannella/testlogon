appId: com.testlogon.android
---
- stopApp
- launchApp:
    clearState: true
- assertVisible:
    id: "login_screen"
- tapOn:
    id: "login_email"
- inputText: "a_par35_1785838888@example.com"
- tapOn:
    id: "login_password"
- inputText: "Passw0rd!123"
- hideKeyboard
- tapOn:
    id: "login_submit"
- extendedWaitUntil:
    visible:
      id: "tab_more"
    timeout: 30000
- tapOn:
    id: "tab_more"
- assertVisible:
    id: "more_screen"
- tapOn:
    id: "more_hub_community"
- assertVisible:
    id: "more_hub_screen"
- scrollUntilVisible:
    element:
      id: "more_entry_syndicates"
    direction: DOWN
    timeout: 15000
- tapOn:
    id: "more_entry_syndicates"
- assertVisible:
    id: "syndicates_list_screen"
- tapOn:
    id: "syndicates_tab_discover"
- extendedWaitUntil:
    visible:
      id: "syndicate_discover_row_synd_DICqg9CmTlmT"
    timeout: 20000
- assertVisible:
    id: "syndicate_discover_row_synd_DICqg9CmTlmT"
- assertVisible:
    text: ".*PAR35 Discover Syndicate.*"
