# AND-005 — detekt configuration.
# Lenient by design for the current scaffold: rules stay active and reports are produced,
# but thresholds are relaxed so detekt does not destabilize the existing, working build.
# Tighten these over time; `buildUponDefaultConfig = true` is set in the convention wiring.

build:
  maxIssues: 0
  excludeCorrectable: false

config:
  # Validation off: rule-property names can drift across detekt / compose-rules versions; we do not
  # want config validation to fail the standalone `detekt` task on the current scaffold.
  validation: false
  warningsAsErrors: false
  checkExhaustiveness: false

processors:
  active: true

console-reports:
  active: true

comments:
  active: true
  UndocumentedPublicClass:
    active: false
  UndocumentedPublicFunction:
    active: false
  UndocumentedPublicProperty:
    active: false

complexity:
  active: true
  LongMethod:
    active: true
    threshold: 80
  LongParameterList:
    active: true
    functionThreshold: 8
    constructorThreshold: 10
    ignoreDefaultParameters: true
    ignoreAnnotated: ['Inject', 'Composable']
  CyclomaticComplexMethod:
    active: true
    threshold: 20
  TooManyFunctions:
    active: false
  NestedBlockDepth:
    active: true
    threshold: 6

naming:
  active: true
  FunctionNaming:
    active: true
    ignoreAnnotated: ['Composable', 'Test']
  TopLevelPropertyNaming:
    active: true
  MatchingDeclarationName:
    active: false

style:
  active: true
  MagicNumber:
    active: false
  WildcardImport:
    active: true
  ReturnCount:
    active: true
    max: 6
  ForbiddenComment:
    active: false
  MaxLineLength:
    active: true
    maxLineLength: 120
  UnusedPrivateMember:
    active: true
  DataClassContainsFunctions:
    active: false
  UnnecessaryAbstractClass:
    active: false

potential-bugs:
  active: true

exceptions:
  active: true
  TooGenericExceptionCaught:
    active: false
  SwallowedException:
    active: false

# Compose rule set (io.nlopez.compose.rules). Kept light to avoid destabilizing existing UI.
Compose:
  ComposableNaming:
    active: false
  ModifierMissing:
    active: false
  ModifierComposable:
    active: false
  MutableParams:
    active: true
  UnstableCollections:
    active: false
  ParameterNaming:
    active: false

formatting:
  active: false
